<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/css/cadastro.css">
    <title>login</title>
</head>

<body>
    <div class="container-fluid">
        <main>
            <section class="">
                <div class="container align-items-center d-flex vw-100 vh-100 justify-content-center">
                    <div class="row justify-content-center align-items-center row-cols-1">
                        <div class="col-12 col-md-12 ">
                            <div class="card vidro px-5 py-5 rounded-4">
                                <p class="fs-1 fw-bold text-center text-white">Seu Login</p>
                                <p class="fw-bold fs-5 text-white">Login</p>
                                <form id="formCadastro">
                                    <div class="mb-3">
                                        <label for="email" class="mb-1 fw-bold text-white">E-mail</label>
                                        <div class="input-group">
                                            <input type="email" class="form-control pe-5 ps" placeholder="Digite seu e-mail"
                                                id="email" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="senha" class="mb-1 fw-bold text-white">Senha</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" placeholder="Digite sua senha"
                                                id="senha" required>
                                        </div>
                                    </div>
                                    
                                    <div class="text-center">
                                        <button class="text-white rounded-pill btn w-100 mt-3 cor-entrar"
                                            type="submit">Entrar</button>
                                    </div>
                            </div>
                            </form>
                        </div>
                    </div>
                </div>
    </div>
    </section>
    </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/supabase.js"></script>
    <script src="./assets/js/login.js"></script>
</body>

</html>
