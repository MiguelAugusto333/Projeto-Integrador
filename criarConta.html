<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/css/cadastro.css">
    <title>Cadastro</title>
</head>
<body>
    <div class="container-fluid">
        <main>
            <section>
                <div class="container align-items-center d-flex vh-100 vw-100 justify-content-center">
                    <div class="row justify-content-center align-items-center row-cols-1">
                        <div class="col-12 col-md-12 ">
                        <div class="card px-4 py-2 rounded-4">
                            <p class="fs-1 fw-bold">Criar sua conta</p>
                            <p class="fw-light fs-5">Preencha seus dados abaixo</p>
                            <form id="formCadastro">
                            <div class="mb-3">
                                <label for="nome" class="mb-1 fw-bold">Nome Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                                        </svg>
                                    </span>
                                    <input type="text" class="form-control" placeholder="Digite seu nome completo" id="nome" required>   
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="mb-1 fw-bold">E-mail</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-briefcase-fill" viewBox="0 0 16 16">
                                        <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v1.384l7.614 2.03a1.5 1.5 0 0 0 .772 0L16 5.884V4.5A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5"/>
                                        <path d="M0 12.5A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5V6.85L8.129 8.947a.5.5 0 0 1-.258 0L0 6.85z"/>
                                        </svg>
                                    </span>
                                    <input type="email" class="form-control" placeholder="Digite seu e-mail" id="email" required>   
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="senha" class="mb-1 fw-bold">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock-fill" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/>
                                        </svg>
                                    </span>
                                    <input type="password" class="form-control" placeholder="Digite sua senha" id="senha" required>   
                                </div>
                            </div><div class="mb-3">
                                <label for="confirmarSenha" class="mb-1 fw-bold">Confirme sua senha</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock-fill" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/>
                                        </svg>
                                    </span>
                                    <input type="password" class="form-control" placeholder="Confirme sua senha" id="confirmarSenha" required>   
                                </div>
                            </div>
                            <div class="d-flex gap-1 mb-3">
                                <input type="checkbox" id="termos" required>
                                <label for="termos">
                                    Eu aceitos os Termos de Uso e a Politica de Privacidade
                                </label>
                            </div>
                            <div class="text-center">
                                <button class="text-white rounded-pill btn criarConta" type="submit">Criar conta</button>
                                <p class="text-center mt-3">
                                Já tem uma conta?
                                <a href="./login.html">Faça login</a>
                                </p>
                                </div>
                            </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/supabase.js"></script>
    <script src="./assets/js/criarConta.js"></script>
</body>
</html>
