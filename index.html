<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Linear+B&display=swap" rel="stylesheet">
    <title>The Nor Way</title>
</head>

<body>
    <div class="container-fluid vh-100">
        <header>
            <div class="container-fluid mt-3">
                <div class="row">
                    <div class="d-flex justify-content-between text-white">
                        <div class="d-flex px-5">
                            <p class="fs-2 fw-bold ms-5" data-aos="fade-right">The NorWay</p>
                        </div>
                        <div class="d-flex gap-2  mt-2"  data-aos="fade-left">
                            <a class="topico01 fs-5 btn border-0 text-white">Geral</a>
                            <a class="topico02 fs-5 btn border-0 text-white">História</a>
                            <a class="topico03 fs-5 btn border-0 text-white">Cultura</a>
                            <a class="topico04 fs-5 btn border-0 text-white">Culinária</a>
                            <a class="topico05 fs-5 btn border-0 text-white">Geografia</a>
                            <a class="topico06 fs-5 btn border-0 text-white">Vikings</a>
                            <a href="" class="topico07 fs-5 btn border-0 text-white">Futebol</a>
                            <a href="" class="topico08 fs-5 btn border-0 text-white">Curiosidades</a>
                        </div>
                        <div class="d-flex justify-content-center border border-1  rounded rounded-pill me-5 px-4 py-2">
                            <p class=" fs-4 fw-medium">Explore</p>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="image rounded-top-4">
            <div class="container">
                <div class="row">
                    <div class="col-6 col-md-6 mt-5">
                        <p class="fw-bold fiordes text-white mt-5" data-aos="fade-up-right">Terra de fiordes, Vikings e sol da meia-noite</p>
                        <span class="border border-1 rounded-pill p-2 text-white" data-aos="fade-up-right">
                            <span data-aos="fade-up-right" class="fw-medium">Um guia rápido sobre a Noruega: História, comida, paisagem e futebol.</span>
                        </span>
                        <p
                            class="comecarExplorar mt-5 btn bg-white rounded-pill fw-bold fs-4 border border-1 ps-3 pe-3 shadow">
                            Começar a explorar</p>
                    </div>
                </div>
            </div>
        </main>
        <div class="container">
            <div class="card rounded-4">
                <div class="card-body">
                    <div class="d-flex justify-content-center align-items-center">
                        <p class="fs-1 fw-bold">Noruega em Geral</p>
                    </div>
                    <div class="row row-cols-3">
                        <div class="col">
                            <div class="card border border-2 border-black ps-3 ">
                                <p class="fs-4 fw-bold">Oslo</p>
                                <p>Capital</p>
                            </div>
                        </div>
                        <div class="col">
                            <div class="card border border-2 border-black ps-3">
                                <p class="fs-4 fw-bold"></p>
                            </div>
                        </div>
                        <div class="col">
                            <div class="card border border-2 border-black ps-3">
                                
                            </div>
                        </div>
                    </div>
                    <div class="row"></div>
                </div>
            </div>
        </div>
        </div>
        <footer></footer>
    </div>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
