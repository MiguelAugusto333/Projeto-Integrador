<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./assets/css/jogadores.css" />
    <title>Jogadores - Seleção Norueguesa</title>
</head>
<body>
    <div class="container-fluid">
    <main>
        <section>
        <div
            class="container d-flex justify-content-center align-items-center"
        >
            <div
            class="row d-flex justify-content-center align-items-center row-cols-1"
            >
            <div class="col-12 col-md-12 col-sm-12">
                <div class="principal card">
                <div class="card-body">
                    <div class="container py-5">
    <div class="row align-items-center justify-content-center">
        <!-- Seta anterior -->
        <div class="col-auto">
            <button id="prevPlayer"
                class="btn btn-dark rounded-circle p-3">
                <i class="bi bi-chevron-left"></i>
            </button>
        </div>
        <!-- Card do jogador -->
        <div class="col-10 col-md-8 col-lg-6 col-xl-5">
            <div class="card bg-dark text-white border-danger border-2 rounded-4 overflow-hidden">
                <img id="playerImage"
                    src=""
                    class="card-img-top img-fluid"
                    alt="Jogador">
                <div class="card-body text-center">
                    <!-- Informações -->
                    <h2 id="playerName" class="card-title fw-bold"></h2>
                    <h6 id="playerNumber" class="text-danger"></h6>
                    <span id="playerPosition"
                        class="badge bg-danger mb-2">
                    </span>
                    <p id="playerCountry" class="text-secondary">
                        🇳🇴 NORUEGA
                    </p>
                    <hr class="border-secondary">
                    <!-- Estatísticas -->
                    <h5 class="fw-bold mb-3">
                        Estatísticas
                    </h5>
                    <div class="row g-3">
                        <div class="col-6">
                            <div class=" bg-opacity-25 rounded-3 p-3">
                                <i class="bi bi-dribbble"></i>
                                <p class="mb-1">Gols</p>
                                <h4 id="playerGoals" class="fw-bold"></h4>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-secondary bg-opacity-25 rounded-3 p-3">
                                <i class="bi bi-lightning"></i>
                                <p class="mb-1">Assistências</p>
                                <h4 id="playerAssists" class="fw-bold"></h4>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-secondary bg-opacity-25 rounded-3 p-3">
                                <i class="bi bi-person-standing"></i>
                                <p class="mb-1">Partidas</p>
                                <h4 id="playerMatches" class="fw-bold"></h4>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-secondary bg-opacity-25 rounded-3 p-3">
                                <i class="bi bi-clock"></i>
                                <p class="mb-1">Minutos</p>
                                <h4 id="playerMinutes" class="fw-bold"></h4>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="bg-secondary bg-opacity-25 rounded-3 p-3">
                                <i class="bi bi-star-fill text-warning"></i>
                                <p class="mb-1">Nota média</p>
                                <h4 id="playerRating" class="fw-bold"></h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Contador -->
            <p id="playerCounter"
                class="text-center text-secondary mt-3">
            </p>
        </div>
        <!-- Seta próximo -->
        <div class="col-auto">
            <button id="nextPlayer"
                class="btn btn-dark rounded-circle p-3">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>
</div>
                </div>
                </div>
            </div>
            </div>
        </div>
        </section>
    </main>
    </div>
    <script src="./assets/js/jogadores.js"></script>
</body>
</html>
